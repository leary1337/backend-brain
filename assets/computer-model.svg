<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img" aria-labelledby="title desc">
  <title id="title">Рабочая модель компьютера</title>
  <desc id="desc">CPU исполняет инструкции и обменивается данными с RAM. Накопитель и сетевой интерфейс обеспечивают хранение и внешний обмен. ОС управляет ресурсами.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs>
  <rect width="940" height="410" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="470" y="38" font-size="24" font-weight="600" fill="#0f172a">Выполнение, память и ввод-вывод</text>
    <rect x="45" y="100" width="230" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="148" font-size="24" font-weight="600" fill="#1e3a8a">CPU</text><text x="160" y="181" font-size="17" fill="#1e3a8a">Выполняет инструкции</text>
    <rect x="355" y="100" width="230" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="470" y="148" font-size="24" font-weight="600" fill="#14532d">RAM</text><text x="470" y="181" font-size="17" fill="#14532d">Инструкции и данные</text>
    <rect x="670" y="80" width="230" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="785" y="117" font-size="21" font-weight="600" fill="#78350f">Накопитель</text><text x="785" y="146" font-size="16" fill="#78350f">Долговременное хранение</text>
    <rect x="670" y="195" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="785" y="232" font-size="21" font-weight="600" fill="#4c1d95">Сетевой интерфейс</text><text x="785" y="261" font-size="16" fill="#4c1d95">Внешний обмен</text>
    <path d="M285 160 H345" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M595 140 H625 V125 H660 M595 185 H625 V240 H660" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="45" y="325" width="855" height="52" rx="12" fill="#e2e8f0"/>
    <text x="472" y="358" font-size="19" fill="#334155">ОС управляет ресурсами и предоставляет интерфейсы программам</text>
    <text x="470" y="305" font-size="15" fill="#475569">Стрелки показывают обмен данными, а не точную схему шин</text>
  </g>
</svg>
