<polyline points="850.2736809246462,335.3465918192059 845,345 839.7263190753538,335.3465918192059" fill="none" stroke="#7952c5" stroke-width="4" stroke-linejoin="round"/>
<text x="340.00" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#52647b" dominant-baseline="text-before-edge">Системные вызовы</text>
<rect x="40" y="360" width="1040" height="125" rx="16" fill="#e5f5ed" stroke="#16845b" stroke-width="2"/>
<text x="60.00" y="378" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#16845b" dominant-baseline="text-before-edge">ЯДРО ОПЕРАЦИОННОЙ СИСТЕМЫ</text>
<text x="60.00" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Проверка прав · планирование · память · файлы · драйверы</text>
