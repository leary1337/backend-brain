<text x="630.00" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#7952c5" dominant-baseline="text-before-edge">ПРИЛОЖЕНИЕ B</text>
<text x="630.00" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Пользовательское пространство</text>
<polyline points="275,270 275,345" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
<polyline points="280.2736809246462,335.3465918192059 275,345 269.7263190753538,335.3465918192059" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
