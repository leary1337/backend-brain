<rect x="40" y="550" width="1040" height="52" rx="16" fill="#e8eef7" stroke="#e8eef7" stroke-width="2"/>
<text x="317.51" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">ОБОРУДОВАНИЕ: CPU · RAM · накопители · сеть</text>
<text x="40.00" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#52647b" dominant-baseline="text-before-edge">Переход в ядро не обязательно означает переключение на другую задачу.</text></svg>