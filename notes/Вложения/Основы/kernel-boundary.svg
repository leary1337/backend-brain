<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img"><title>Граница между приложением и ядром</title><rect width="1120" height="660" fill="#f6f8fc"/><text x="40.00" y="27" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#16263d" dominant-baseline="text-before-edge">Граница между приложением и ядром</text>
<text x="40.00" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52647b" dominant-baseline="text-before-edge">Обычные вычисления выполняет CPU; привилегированные операции проходят через ядро</text>
<rect x="40" y="145" width="470" height="110" rx="16" fill="#e8f0ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.00" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#2563eb" dominant-baseline="text-before-edge">ПРИЛОЖЕНИЕ A</text>
<text x="60.00" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Пользовательское пространство</text>
