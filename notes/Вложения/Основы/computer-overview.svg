<rect x="40" y="470" width="1040" height="100" rx="16" fill="#e8eef7" stroke="#e8eef7" stroke-width="2"/>
<text x="65.00" y="488" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#16263d" dominant-baseline="text-before-edge">Операционная система</text>
<text x="65.00" y="529" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Управляет ресурсами и предоставляет программам доступ к ним</text>
<text x="40.00" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#52647b" dominant-baseline="text-before-edge">Стрелки показывают обмен данными; точная схема шин и контроллеров здесь опущена.</text></svg>