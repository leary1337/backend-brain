<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img"><title>Компьютер: четыре роли</title><rect width="1120" height="660" fill="#f6f8fc"/><text x="40.00" y="27" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#16263d" dominant-baseline="text-before-edge">Компьютер: четыре роли</text>
<text x="40.00" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52647b" dominant-baseline="text-before-edge">Кто выполняет работу, где находятся данные и как они попадают в систему</text>
<rect x="40" y="175" width="280" height="220" rx="16" fill="#e8f0ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.00" y="193" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#2563eb" dominant-baseline="text-before-edge">ПРОЦЕССОР</text>
<text x="60.00" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Инструкции</text>
<text x="60.00" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Вычисления</text>
<text x="60.00" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Регистры и кэши</text>
<rect x="405" y="175" width="310" height="220" rx="16" fill="#e5f5ed" stroke="#16845b" stroke-width="2"/>
<text x="425.00" y="193" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#16845b" dominant-baseline="text-before-edge">ОПЕРАТИВНАЯ ПАМЯТЬ</text>
<text x="425.00" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Рабочие данные</text>
<text x="425.00" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Инструкции программы</text>
<text x="425.00" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Буферы обмена</text>
<rect x="800" y="145" width="280" height="120" rx="16" fill="#fff2dc" stroke="#b76b0c" stroke-width="2"/>
<text x="820.00" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#b76b0c" dominant-baseline="text-before-edge">НАКОПИТЕЛЬ</text>
<text x="820.00" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Файлы между запусками</text>
<rect x="800" y="285" width="280" height="160" rx="16" fill="#f0eaff" stroke="#7952c5" stroke-width="2"/>
<text x="820.00" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#7952c5" dominant-baseline="text-before-edge">СЕТЕВОЙ</text>
<text x="820.00" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#7952c5" dominant-baseline="text-before-edge">ИНТЕРФЕЙС</text>
<text x="820.00" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">Обмен с другими</text>
<text x="820.00" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#16263d" dominant-baseline="text-before-edge">узлами</text>
