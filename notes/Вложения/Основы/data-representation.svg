<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img"><title>Байты одинаковые — смысл задаёт формат</title><rect width="1120" height="660" fill="#0c1913"/><text x="40.00" y="27" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#edf7ef" dominant-baseline="text-before-edge">Байты одинаковые — смысл задаёт формат</text>
